[package]
name = "novu-rust-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
