[package]
name = "novu-rust-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
form_urlencoded = "1"
hmac = "0.13"
sha2_11 = { package = "sha2", version = "0.11" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
ryu = "1"
sha2 = "0.10"
ring = "0.17"
spki = "0.7"
der = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
novu-rust-contracts = { path = "../rust-contracts" }

[dev-dependencies]
novu-postgres-queue = { path = "../../worker/rust-queue" }
http-body-util = "0.1"
