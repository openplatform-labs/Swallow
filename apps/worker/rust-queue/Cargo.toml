[package]
name = "novu-postgres-queue"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
novu-rust-contracts = { path = "../../api/rust-contracts" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
jsonlogic = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
css-inline = { version = "0.18.0", default-features = false }
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
